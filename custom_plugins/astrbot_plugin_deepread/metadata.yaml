name: astrbot_plugin_deepread
display_name: 深读
short_desc: 让小蜗读懂群里分享的内容——卡片会顺链接点进去读正文，读不到就如实说，不编。
desc: >
  让小蜗读懂群里的分享。收到分享卡片或链接时，插件会抢在模型作答之前把正文抓好，
  直接塞进这一轮的上下文里——不依赖模型自己去挑工具，因此不会出现「拿通用网页抓取
  抓了个标题、再拿搜索结果编出帖子内容」这种事。小黑盒/B站/GitHub 走官方接口，
  其余站点抓网页正文与页面元数据；小黑盒的分享接口需要实时计算签名（hkey/_time/nonce），
  能拿到帖子正文、作者、话题、互动数与热评，并顺带取回配图。
  抓不到时如实说明原因（正文只在该 App 内渲染 / 页面靠 JS 渲染 / 机房 IP 被风控），
  并给出用户自己能点开的地址，绝不拿标题去编内容。
  支持分享卡片、网页链接、群文件、合并转发与图片。
  群里发的截图也能读（多模态识别），对正文拿不到的站点是最有效的补充。
  视频类分享（B站/抖音/快手/YouTube 等）自动跳过，交给专门的视频解析插件。
help: >
  不用打指令，直接问小蜗就行：「看看这个卡片」「刚才那个链接讲的啥」，
  也可以引用那条分享消息再问她，或者把内容截图直接发给她。收到分享时插件会自己
  把正文读好放进上下文；如果内容只在她 App 里有、机器人拿不到，她会说明原因，
  并建议你把内容截图发她。
version: v1.6.0
author: jin
repo: ""
astrbot_version: ">=4.16,<5"
support_platforms:
  - aiocqhttp
  - qq_official
  - telegram
  - lark
